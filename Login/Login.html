<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles/Login.css">
    <title>Login</title>
</head>
<body>
    <div class="ContenedorP">
        <header class="Titulo">
            <h1>Bienvenido al Inicio de nuestro Software</h1>
        </header>
        <div class="Credenciales">
            <label for="Correo">Correo Electrónico:</label>
            <input type="email" name="Correo" id="Correo" placeholder="Ingrese correo electrónico required"><br><br>
            <label for="Contrasena">Contraseña:</label>
            <input type="password" name="Contrasena" id="Contrasena" placeholder="Ingrese contraseña" required><br><br>
            <button type="submit">Iniciar Sesión</button>
        </div>
    </div>
</body>
</html>
